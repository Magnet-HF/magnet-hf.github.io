name: Library correction or guide request
description: Report a broken link, suggest a correction, or request documentation.
title: "[Library] "
body:
  - type: input
    id: page
    attributes:
      label: Page or topic
      description: Paste the page URL or name the requested topic.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What needs attention?
      description: Include the expected result and any authoritative source. Remove private information.
    validations:
      required: true
